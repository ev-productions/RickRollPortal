<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Company Training Portal</title>
  <style>
    body {
      margin: 0;
      background: #0b0f14;
      font-family: Arial, sans-serif;
      color: #e6edf3;
    }

    .header {
      padding: 12px 20px;
      background: #161b22;
      border-bottom: 1px solid #30363d;
      font-size: 16px;
      font-weight: bold;
    }

    .notice {
      position: absolute;
      top: 50px;
      left: 20px;
      background: rgba(0,0,0,0.6);
      padding: 10px 14px;
      border-radius: 8px;
      font-size: 14px;
      z-index: 2;
    }

    iframe {
      width: 100vw;
      height: calc(100vh - 48px);
      border: none;
    }
  </style>
</head>

<body>

  <div class="header">
    Internal Video Training Portal
  </div>

  <div class="notice">
    🔊 Audio is muted by default — please enable sound
  </div>

<iframe
  src="https://www.youtube.com/embed/xvFZjo5PgG0?autoplay=1&mute=1&controls=0&rel=0"
  frameborder="0"
  allow="autoplay; fullscreen"
  allowfullscreen>
</iframe>
